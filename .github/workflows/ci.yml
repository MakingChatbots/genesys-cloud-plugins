name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@makingchatbots"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run lint
      - run: pnpm run typecheck # Check TS types. Not done by linting or building
      - run: pnpm run build
      - name: Verify committed bundles match source
        run: |
          git diff --stat --exit-code servers/ scripts/ || {
            echo "::error::Committed bundles are out of sync with source. Run 'pnpm run build' and commit the result."
            exit 1
          }
      - name: Smoke test MCP server
        run: >
          pnpm dlx @modelcontextprotocol/inspector --cli node servers/genesys-cloud-architect-mcp.js --method tools/list
          -e PREVENT_LOGIN=TRUE
          -e GENESYS_REGION=DUMMY_VALUE
          -e GENESYS_CLIENT_ID=DUMMY_VALUE
          -e GENESYS_CLIENT_SECRET=DUMMY_VALUE
          -e DEPLOY_SCRIPT_PATH=DUMMY_VALUE
          | grep -q '"flow_ir"'
